# Kerb photo model pilot: trains a small U-Net on NSW 7 cm aerial photos (NSW Imagery, CC BY 4.0) against council kerbs and scores
# the held-out boxes (Mona Vale, Newport, Parramatta) with compare_kerbs.py (copy of tools/derive/github/kerb-photo.yml; synced
# into the public openfetch-derive repo by tools/derive/github/sync.sh: public, so runner minutes are free; no secrets, ever).
# Runs by hand (Actions > kerb-photo > Run workflow); the tuning loop (kerb-tune.yml) runs the same pilot as its round 1.
# Results: the SCORES line at the end of the log, and artifact kerb-photo (scores.json, pictures, lines, model).
name: kerb-photo
on:
  workflow_dispatch:
    inputs:
      steps: {description: 'Training steps', required: false, default: '3500'}
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install numpy scipy shapely scikit-image rasterio affine pillow matplotlib
      - run: python3 openfetch/tools/derive/kerbphoto.py pilot kp
        env:
          KERB_STEPS: ${{ inputs.steps || '3500' }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kerb-photo
          path: |
            kp/scores.json
            kp/*.png
            kp/*_derived_*.geojson
            kp/model.pt
          if-no-files-found: warn
